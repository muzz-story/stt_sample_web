[package]
name = "stt_sample_app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
mp3lame-encoder = { version = "0.3.0", features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
